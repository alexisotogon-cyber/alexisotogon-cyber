<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">Mr.Soto — FinOps &amp; Cloud Engineer</title><desc id="d">Diagrama animado: facturas de AWS, GCP y Azure fluyen a un motor FinOps que reduce hasta 45% el costo y alimenta Terraform y Kubernetes.</desc><style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
