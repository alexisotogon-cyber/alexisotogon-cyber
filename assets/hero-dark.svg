    .pk{offset-rotate:0deg;animation:run 3.6s cubic-bezier(.45,0,.55,1) infinite;opacity:0}
    @keyframes run{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pul 3s ease-in-out infinite} @keyframes pul{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
    .l{opacity:0;animation:line 12s infinite} .l2{animation-delay:4s} .l3{animation-delay:8s}
    @keyframes line{0%{opacity:0;transform:translateY(8px)}4%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
    .cur{animation:blink 1s steps(2) infinite} @keyframes blink{50%{opacity:0}}
    .in{opacity:0;animation:in .9s ease-out forwards} @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
