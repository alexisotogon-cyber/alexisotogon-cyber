services:
  noche-de-pelis:
    image: nginx:1.27-alpine
    container_name: noche-de-pelis   # debe coincidir con el servicio en la ruta del tunnel: http://noche-de-pelis:80
    env_file: .env                   # TMDB_TOKEN=...
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    restart: unless-stopped
    networks:
      - web
    # Sin "ports:": el tunnel de Cloudflare maneja el acceso

networks:
  web:
    external: true
